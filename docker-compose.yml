services:

  backend:
    image: thesamihub/mern-docker-cicd-backend:${IMAGE_TAG}
    container_name: node_backend
    env_file:
      - ./backend/.env
    expose:
      - "5080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5080/ || exit 1"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: thesamihub/mern-docker-cicd-frontend:${IMAGE_TAG}
    container_name: react_frontend
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped